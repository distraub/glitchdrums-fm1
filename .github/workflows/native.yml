name: Native FM-1 package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: python3 tools/build_native.py
      packages: build/*.fwsc
      test: sh tests/run.sh && sh tests/run-update.sh build/*.fwsc
      sdk: false
